log_level: debug
log_source: false

http:
    serviceName: 'api-service'
    host: pro.sealur.ru
    port: 8080
    maxHeaderBytes: 1
    readTimeout: 10s
    writeTimeout: 10s
    domain: http://pro.sealur.ru
    link: http://pro.sealur.ru

cache:
    ttl: 3600s

auth:
    accessTokenTTL: 20m
    refreshTokenTTL: 24h
    limitAuthTTL: 30m
    countAttempt: 5
    confirmTTL: 1h
    secure: false
    domain: pro.sealur.ru

postgres:
    db_name: pro
    # db_name: sealur_pro
    host: 127.0.0.1
    # host: pro.sealur.ru
    port: 5436
    # port: 5432
    ssl_mode: disable
    username: postgres

redis:
    host: pro.sealur.ru
    port: 6379
    db: 0

minio:
    endpoint: pro.sealur.ru:9000
    useSSL: false
    bucket: pro
    disabledFileTypes: 
        - "application/octet-stream"
	    - "application/x-ms-dos-executable"
	    - "magnus-internal/cgi"
	    - "text/javascript"
	    - "application/javascript"
	    - "application/vnd.microsoft.portable-executable"
	    - "application/jar"
	    - "application/x-iso9660-image"
	    - "application/x-sh"
    disabledExtensions:
        - ".exe"
        - ".bat"
        - ".ini"
        - ".msi"
        - ".sys"
        - ".reg"

limiter:
    rps: 10
    burst: 20
    ttl: 10m
