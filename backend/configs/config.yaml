log_level: debug
log_source: false

http:
    serviceName: 'api-service'
    host: pro.sealur.ru
    port: 8080
    maxHeaderBytes: 1
    readTimeout: 10s
    writeTimeout: 10s
    domain: http://pro.sealur.ru
    link: http://pro.sealur.ru

cache:
    ttl: 3600s

auth:
    accessTokenTTL: 20m
    refreshTokenTTL: 24h
    limitAuthTTL: 30m
    countAttempt: 5
    confirmTTL: 1h
    secure: false
    domain: pro.sealur.ru

postgres:
    db_name: pro
    # db_name: sealur_pro
    host: 127.0.0.1
    # host: pro.sealur.ru
    port: 5436
    # port: 5432
    ssl_mode: disable
    username: postgres

redis:
    host: pro.sealur.ru
    port: 6379
    db: 0

minio:
    endpoint: pro.sealur.ru:9010
    useSSL: false
    bucket: test
    disabledFileTypes:
        - 'application/octet-stream'
        - 'application/x-ms-dos-executable'
        - 'magnus-internal/cgi'
        - 'text/javascript'
        - 'application/javascript'
        - 'application/vnd.microsoft.portable-executable'
        - 'application/jar'
        - 'application/x-iso9660-image'
        - 'application/x-sh'
    disabledExtensions:
        - '.exe'
        - '.bat'
        - '.ini'
        - '.msi'
        - '.sys'
        - '.reg'

emails:
    feedback: martynov@sealur.ru
    support: pro@sealur.ru
links:
    orders: http://pro.sealur.ru/manager/orders
    app: http://pro.sealur.ru

limiter:
    rps: 10
    burst: 30
    ttl: 10m
